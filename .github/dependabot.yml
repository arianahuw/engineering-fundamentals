version: 2
updates:
  # Keep if your site builds with Node.js (Docusaurus, VitePress, Astro, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "20:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    # Mirrors Renovate's security:minimumReleaseAgeNpm (3-day supply-chain buffer)
    cooldown:
      default-days: 5
    # Mirrors Renovate's :semanticPrefixFixDepsChoreOthers
    commit-message:
      prefix: "chore"
      include: "scope"
    # Mirrors Renovate's group:recommended / group:monorepos
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"